<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cortex Quest — Train Your Mind. Conquer Every Challenge. A premium gamified learning platform." />
  <meta name="theme-color" content="#3A5311" />
  <title>Cortex Quest — Train Your Mind</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap 5.3.2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons 1.11 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <!-- Cortex Quest CSS (load order matters) -->
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/puzzle.css" />
</head>
<body>

<div id="cq-app">
  <!-- Main page content renders here -->
  <div id="cq-main">
    <!-- Loading state while scripts initialize -->
    <div id="cq-init-loader" style="
      position:fixed; inset:0; background:#0d1a05;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:9999; gap:1.5rem;
    ">
      <div style="font-size:3rem; animation: pulse 1.5s infinite;">🧠</div>
      <div style="font-family:'Outfit',sans-serif; font-size:1.5rem; color:#7a9a5c; font-weight:700; letter-spacing:2px;">CORTEX QUEST</div>
      <div style="width:200px; height:4px; background:rgba(58,83,17,0.3); border-radius:999px; overflow:hidden;">
        <div id="cq-init-bar" style="height:100%; background:linear-gradient(90deg,#3A5311,#7a9a5c); border-radius:999px; width:0%; transition:width 0.3s;"></div>
      </div>
      <div style="color:rgba(232,240,216,0.5); font-size:0.8rem; font-family:'Inter',sans-serif;">Initializing...</div>
    </div>
  </div>

  <!-- Toast notification container -->
  <div id="cq-toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Global modal overlay -->
  <div id="cq-modal-overlay" class="cq-modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div id="cq-modal" class="cq-modal animate-bounce-in"></div>
  </div>

  <!-- Particle effects container -->
  <div id="cq-particles" aria-hidden="true"></div>

  <!-- Audio elements (no src until needed) -->
  <audio id="cq-bgm" loop preload="none"></audio>
  <audio id="cq-voice" preload="none"></audio>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ====================================================
     SCRIPT LOADING ORDER (dependencies first)
     ==================================================== -->

<!-- Layer 1: Foundation utilities -->
<script src="js/utils.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/player.js"></script>
<script src="js/theme.js"></script>
<script src="js/audio.js"></script>
<script src="js/router.js"></script>

<!-- Layer 2: Data -->
<script src="data/modules.js"></script>
<script src="data/achievements.js"></script>

<!-- Layer 3: Question Banks (24 submodules) -->
<script src="data/questions/arithmetic.js"></script>
<script src="data/questions/quantitative.js"></script>
<script src="data/questions/time-work.js"></script>
<script src="data/questions/tables-charts.js"></script>
<script src="data/questions/graph-analysis.js"></script>
<script src="data/questions/caselet.js"></script>
<script src="data/questions/verbal-reasoning.js"></script>
<script src="data/questions/analytical-reasoning.js"></script>
<script src="data/questions/non-verbal.js"></script>
<script src="data/questions/science-tech.js"></script>
<script src="data/questions/history-geo.js"></script>
<script src="data/questions/current-affairs.js"></script>
<script src="data/questions/prog-fundamentals.js"></script>
<script src="data/questions/control-statements.js"></script>
<script src="data/questions/arrays-ds.js"></script>
<script src="data/questions/operating-systems.js"></script>
<script src="data/questions/dbms.js"></script>
<script src="data/questions/networks.js"></script>
<script src="data/questions/electrical.js"></script>
<script src="data/questions/mechanical.js"></script>
<script src="data/questions/eng-math.js"></script>
<script src="data/questions/anatomy.js"></script>
<script src="data/questions/physiology.js"></script>
<script src="data/questions/medical-science.js"></script>

<!-- Layer 4: Game Engines -->
<script src="js/gamification.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/quiz.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/store-shop.js"></script>
<script src="js/mock-test.js"></script>
<script src="js/brain-training.js"></script>

<!-- Layer 5: Pages -->
<script src="pages/splash.js"></script>
<script src="pages/auth.js"></script>
<script src="pages/dashboard.js"></script>
<script src="pages/modules.js"></script>
<script src="pages/level-map.js"></script>
<script src="pages/quiz-screen.js"></script>
<script src="pages/results.js"></script>
<script src="pages/achievements.js"></script>
<script src="pages/leaderboard.js"></script>
<script src="pages/store.js"></script>
<script src="pages/mock-test.js"></script>
<script src="pages/brain-training.js"></script>
<script src="pages/profile.js"></script>
<script src="pages/daily-challenge.js"></script>

<!-- Layer 6: App entry (LAST) -->
<script src="js/app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex Quest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Header + tabs are shown only after login (script.js toggles #shell) -->
  <div id="shell" class="d-none">
    <header class="topbar container-xl d-flex align-items-center justify-content-between py-2">
      <a href="#" class="brand" onclick="go('home');return false">
        <img src="logo.png" alt="Cortex Quest" width="34" height="34" />
        <span>Cortex Quest</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <span id="hdrStats" class="chips"></span>
        <button id="musicBtn" class="btn btn-soft btn-sm" onclick="toggleMusic()" aria-label="Music on/off" title="Music on/off">🔊</button>
        <button id="voiceBtn" class="btn btn-soft btn-sm" onclick="toggleVoice()" aria-label="Voice on/off" title="Voice on/off">🗣️</button>
        <div class="dropdown">
          <button id="themeBtn" class="btn btn-soft btn-sm" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Choose color theme" title="Choose color theme">🎨</button>
          <ul id="themeMenu" class="dropdown-menu dropdown-menu-end" aria-label="Color themes"></ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-soft btn-sm" data-bs-toggle="dropdown" aria-label="Menu">⚙️</button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" onclick="go('revision');return false">📚 Revision</a></li>
            <li><a class="dropdown-item" href="#" onclick="go('settings');return false">⚙️ Settings</a></li>
            <li><a class="dropdown-item" href="#" onclick="logout();return false">🚪 Logout</a></li>
          </ul>
        </div>
      </div>
    </header>
    <nav id="tabs"></nav>
  </div>

  <main id="app" class="container-xl pb-5"></main>
  <div id="pops"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
